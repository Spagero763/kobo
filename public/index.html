<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kobo</title>
<meta name="description" content="Send naira onchain without holding CELO.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' x='4' font-size='26' font-family='system-ui'>₦</text></svg>">
<style>
  :root {
    --bg: #fbfaf8;
    --surface: #ffffff;
    --line: #e6e3dd;
    --ink: #16150f;
    --muted: #6b675c;
    --faint: #9b978c;
    --accent: #1a7f4b;
    --accent-ink: #ffffff;
    --danger: #b4402c;
    --warn: #8a6212;
    --warn-bg: #fdf6e3;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(20,18,10,.05), 0 8px 24px -12px rgba(20,18,10,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12120f;
      --surface: #1a1a16;
      --line: #2c2b25;
      --ink: #f2f0ea;
      --muted: #a3a094;
      --faint: #74716a;
      --accent: #35c07a;
      --accent-ink: #0d1a12;
      --danger: #e08472;
      --warn: #e0b64a;
      --warn-bg: #241f10;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 0 0 48px;
  }
  .wrap { max-width: 460px; margin: 0 auto; padding: 0 16px; }

  header {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .bar { display: flex; align-items: center; gap: 10px; padding: 12px 0; }
  .logo { font-weight: 640; letter-spacing: -.02em; font-size: 18px; }
  .logo span { color: var(--accent); }
  .net {
    margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px;
    background: var(--surface);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.live { background: var(--accent); }
  .dot.bad { background: var(--danger); }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 18px; margin-top: 14px;
  }

  .bal-label { font-size: 12.5px; color: var(--muted); letter-spacing: .01em; }
  .bal { font-size: 34px; font-weight: 620; letter-spacing: -.025em; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .bal small { font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 2px; }
  .addr { font-size: 12.5px; color: var(--faint); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin-top: 6px; }

  .skel { display: inline-block; border-radius: 6px; background: linear-gradient(90deg, var(--line) 25%, color-mix(in srgb, var(--line) 45%, transparent) 50%, var(--line) 75%); background-size: 200% 100%; animation: sh 1.1s linear infinite; color: transparent !important; }
  @keyframes sh { to { background-position: -200% 0; } }

  label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px; }
  input {
    width: 100%; padding: 12px 13px; font-size: 16px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    font-family: inherit; outline: none; transition: border-color .12s, box-shadow .12s;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
  input.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; }
  input[aria-invalid="true"] { border-color: var(--danger); }
  .field { margin-bottom: 14px; }
  .err { font-size: 12.5px; color: var(--danger); margin-top: 6px; min-height: 1em; }

  .chips { display: flex; gap: 7px; margin-top: 8px; flex-wrap: wrap; }
  .chip { font-size: 12.5px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); cursor: pointer; font-family: inherit; }
  .chip:hover { border-color: var(--accent); color: var(--ink); }

  button.primary {
    width: 100%; padding: 13px; font-size: 15.5px; font-weight: 560; font-family: inherit;
    color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 11px;
    cursor: pointer; transition: opacity .12s, transform .06s;
  }
  button.primary:hover:not(:disabled) { opacity: .92; }
  button.primary:active:not(:disabled) { transform: translateY(1px); }
  button.primary:disabled { opacity: .45; cursor: not-allowed; }

  .quote { border-top: 1px dashed var(--line); margin-top: 16px; padding-top: 14px; display: none; }
  .quote.on { display: block; }
  .row { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; padding: 5px 0; }
  .row dt { color: var(--muted); }
  .row dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; }
  .row.total dd { font-weight: 600; }
  dl { margin: 0; }

  .note { font-size: 12.5px; line-height: 1.45; color: var(--warn); background: var(--warn-bg); border: 1px solid color-mix(in srgb, var(--warn) 28%, transparent); border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
  .note.hide { display: none; }

  .status { display: none; align-items: flex-start; gap: 11px; margin-top: 14px; padding: 13px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg); }
  .status.on { display: flex; }
  .status .ic { width: 20px; height: 20px; flex: none; margin-top: 1px; }
  .status .msg { font-size: 13.5px; line-height: 1.45; }
  .status .sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; word-break: break-all; }
  .status a { color: inherit; }
  .spinner { width: 20px; height: 20px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .steps { display: flex; gap: 5px; margin-top: 12px; }
  .step { height: 3px; flex: 1; border-radius: 2px; background: var(--line); overflow: hidden; position: relative; }
  .step i { position: absolute; inset: 0; background: var(--accent); transform: scaleX(0); transform-origin: left; }

  footer { text-align: center; font-size: 12.5px; color: var(--faint); margin-top: 26px; line-height: 1.7; }
  footer a { color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <div class="logo">Kobo<span>.</span></div>
    <div class="net" id="net"><span class="dot" id="netdot"></span><span id="nettext">Checking</span></div>
  </div>
</header>

<main class="wrap">

  <section class="card" aria-labelledby="bal-label">
    <div class="bal-label" id="bal-label">Your naira</div>
    <div class="bal"><span id="bal" class="skel">000,000.00</span><small>NGNm</small></div>
    <div class="addr" id="addr">Not connected</div>
    <div id="connect-wrap" style="margin-top:14px">
      <button class="primary" id="connect">Connect wallet</button>
    </div>
  </section>

  <section class="card" id="send-card" hidden>
    <div class="field">
      <label for="to">Send to</label>
      <input id="to" class="mono" placeholder="0x..." autocomplete="off" spellcheck="false" inputmode="text">
      <div class="err" id="to-err"></div>
    </div>

    <div class="field" style="margin-bottom:10px">
      <label for="amt">Amount</label>
      <input id="amt" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off">
      <div class="err" id="amt-err"></div>
      <div class="chips">
        <button class="chip" data-amt="1000">₦1,000</button>
        <button class="chip" data-amt="5000">₦5,000</button>
        <button class="chip" data-amt="20000">₦20,000</button>
        <button class="chip" id="chip-max">Max</button>
      </div>
    </div>

    <div class="quote" id="quote">
      <dl>
        <div class="row"><dt>They receive</dt><dd id="q-arrives">—</dd></div>
        <div class="row"><dt>Network fee</dt><dd id="q-fee">—</dd></div>
        <div class="row total"><dt>Leaves your balance</dt><dd id="q-total">—</dd></div>
      </dl>
      <div class="note hide" id="gasnote"></div>
    </div>

    <div style="margin-top:16px">
      <button class="primary" id="send" disabled>Enter an amount</button>
    </div>

    <div class="steps" id="steps" hidden>
      <div class="step"><i></i></div><div class="step"><i></i></div><div class="step"><i></i></div>
    </div>

    <div class="status" id="status" role="status" aria-live="polite">
      <div class="ic" id="status-ic"></div>
      <div><div class="msg" id="status-msg"></div><div class="sub" id="status-sub"></div></div>
    </div>
  </section>

  <footer>
    Gas is paid in naira. You never need CELO.<br>
    <a href="https://github.com/Spagero763/kobo">Source</a> · Celo mainnet
  </footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
<script src="/app.js" type="module"></script>
</body>
</html>
